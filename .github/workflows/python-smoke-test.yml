name: Python smoke test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "refactor/**"]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q TCFD_AI.py data_loader.py load_data.py ml_model.py plt_data.py txt.py tests/data_inventory_smoke.py

      - name: Validate CSV files and shared loader
        run: python tests/data_inventory_smoke.py

      - name: Run Streamlit app smoke test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("TCFD_AI.py", default_timeout=90).run()

          def check_page(page_name):
              app.sidebar.selectbox[0].set_value(page_name).run()
              if app.exception:
                  for error in app.exception:
                      print(error.message)
                  raise SystemExit(f"Streamlit app raised an exception on page: {page_name}")
              print(f"Streamlit page passed: {page_name}")

          if app.exception:
              for error in app.exception:
                  print(error.message)
              raise SystemExit("Streamlit app raised an exception on initial run")

          for page in ("大台北簡介", "資料集和資料視覺化", "機器學習", "未來影響"):
              check_page(page)

          print("All Streamlit page smoke tests completed without exceptions.")
          PY
